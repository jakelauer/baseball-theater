name: Deploy

# S114: Baseball Theater on Cloudflare Workers (ADR-017).
# - Every pull request that changes code gets its own preview Worker on workers.dev, and its address is
#   posted on the pull request. It runs on its own Neon branch, `preview-pr-<N>`, a copy of staging's
#   branch reset from it on every deploy, through its own Hyperdrive config, `bt-preview-pr-<N>`, so a
#   pull request's migrations never reach staging's database (issue #42; owner, 2026-11-13, asked "may I
#   change deploy.yml so each PR's preview gets its own Neon branch, deleted when the PR closes?": "Yes,
#   do that."). The Worker, config and branch are deleted when the pull request closes, and the weekly
#   Preview cleanup workflow (preview-cleanup.yml) deletes any a closed pull request left behind.
# - Every push to stage that changes code deploys staging at stage.baseball.theater (a docs-only push
#   deploys nothing), on the Neon `staging` branch: a schema-only branch that never holds a fan's data,
#   unless its build inputs are unchanged since staging's last successful deploy (`pnpm build:inputs
#   check`, S146), which deploys nothing either. A manual run of Deploy on stage with `force` deploys
#   staging whatever the inputs say (a rotated secret or variable changes no file).
# - Build inputs (S146; owner, 2026-11-11: "check the inputs to the build at build time or prior to
#   it (ideal)"): each staging and preview deploy records every file its build read, with its git blob
#   hash and the release label (`pnpm build:inputs record`, functions/src/deploy/build-inputs.ts), and
#   stores the record as an Actions artifact (`build-inputs-staging`, `build-inputs-preview-<N>`) only
#   after its deploy step succeeds. The next run fetches that record before installing anything and,
#   when `build:inputs check` prints `unchanged`, skips install, build, migrations and deploy.
# - Production, at next.baseball.theater, deploys only when the owner publishes a GitHub Release
#   (S121; owner, 2026-11-07: "I think releases to main probably should use GitHub releases, if
#   that's actually possible. I want a release to be a set of PRs basically"). It checks out and
#   deploys exactly the release's tag, and a push to main deploys nothing. Each story reaches stage
#   as its own auto-merged pull request; a release is the pull requests merged into stage since the
#   last one (.github/release.yml groups them in the generated notes). Production has no approval
#   wait (S118: "we don't need that approval step"). The job names the GitHub environment
#   `production` for its secrets; the owner lets that environment deploy from `v*` tags (README).
#   Production stays at next.baseball.theater until the owner cuts baseball.theater over from
#   Elastic Beanstalk by hand (S119; owner, 2026-11-07: "Do the temporary address").
# - Once production is live, `main` is fast-forwarded to the released commit, so it mirrors what
#   production runs (owner, 2026-11-07: "2. Mirror"). Never forced: if main can't fast-forward (a
#   rollback to an older release, or main moved by hand) the job fails loudly and main stays put.
# Every deploy first runs `pnpm deploy:bootstrap` (find or create the Neon branch and the Hyperdrive
# config by name, a preview's branch reset from staging; write the Worker config and secrets), then `pnpm db:migrate` and
# `pnpm db:reapply-deletions` on its own database, and only then `wrangler deploy`, which pushes
# every Worker secret from GitHub secrets. Each step is idempotent (owner, 2026-11-05: "It should be
# idempotent so it can happen with every deployment. All the bootstrapping should be like that."),
# so a re-run changes nothing; a preview's re-run resets its branch from staging and rewrites its
# Hyperdrive config, ending as the first run did. Secrets come only from GitHub secrets; agents never run this.
# `pnpm db:migrate` stops the deploy, before any migration runs and before the Worker goes live, when the
# database's migrations differ from the code's (#48); its error says how to fix it for each environment and kind,
# as the README does (production: stop and ask the owner, never reset or edit it by hand). Production and
# previews pass a database ahead of the code (newer migrations only), with a warning: re-running an older
# release's Deploy run is production's rollback, and a preview's database is reset from staging, which is ahead
# of a pull request built before stage gained a newer migration (a re-run, or no push since). Staging stays strict.
# The version line (#47; owner, 2026-11-13: "Yes, build it that way"): every deploy build first looks
# up its release with scripts/build-release.sh, the milestone of the pull request whose merge commit it
# builds (a preview: its own pull request's milestone and head commit), and prints it with the commit,
# e.g. "v3.2.0 (40767e9)", so the same code reads the same on staging and production. A release can
# target a stage commit newer than the one staging serves when it is docs-only or its build inputs are
# unchanged (`pnpm build:inputs check`, S146), so the commits can differ (owner, 2026-11-13: releasing
# only the served commit "would prevent iterating on stage while waiting to push a release to prod").
# The commit is not a build input: a skipped deploy keeps the older commit in staging's version line.
# Staging and production both write bt-commit.txt, the commit they serve.
# Sign-in (S116): only production has Logto's machine-to-machine app, so only the production jobs
# read its secrets (LOGTO_S2S_APP_ID, LOGTO_S2S_SECRET; owner, 2026-11-07: "LOGTO_S2S_APP_ID and
# LOGTO_S2S_SECRET, go ahead"): the production job pushes them as Worker secrets and, after it
# deploys, the production-logto job sets the web app's sign-in and sign-out addresses with
# `pnpm deploy:logto`. Staging and previews read nothing
# of Logto's.

on:
    pull_request:
        types: [opened, synchronize, reopened, closed]
    push:
        branches: [stage]
    release:
        types: [published]
    # S146: deploy staging even when its build inputs are unchanged (README, "Staging"). Run it on stage.
    workflow_dispatch:
        inputs:
            force:
                description: "Deploy staging even if its build inputs are unchanged (a rotated secret or variable changes no file)"
                type: boolean
                default: false

permissions:
    contents: read
    pull-requests: write

jobs:
    # Docs-only changes (Markdown, docs/, .claude/) skip verify (owner, 2026-11-07: "Things like
    # this shouldn't trigger CI."): a docs-only pull request gets no preview, and a docs-only push
    # to stage doesn't deploy staging either, since nothing it serves changed (owner, 2026-11-11:
    # "Can we avoid deploying when the only change was docs?", then "yeah, I like your plan"). A push
    # whose own change (its commit against its first parent, the previous stage head) is docs-only is
    # code=false at once and never deploys, so GitHub's staging environment lists only code deploys
    # (owner, 2026-11-22: "I don't like that I can't tell when the last actual change that triggered a
    # deploy to stage happened since some changes skip that"; asked whether a docs-only merge should
    # simply never deploy, at the cost of no longer quietly retrying an earlier code deploy that failed
    # or was cancelled: "Never deploy docs-only (Recommended)"). So a docs merge no longer heals a code
    # run that failed or was cancelled: re-run that run (`gh run rerun <id>`), or the next code merge
    # deploys it. Any other push is compared with the last stage commit whose Deploy run passed, so code
    # not yet verified and deployed there (a run still going, cancelled or failed) is deployed with it.
    # A release always runs everything, and so does a manual run (S146's `force`, which must reach the
    # staging job and its pnpm verify). scripts/ci-changes.sh decides, the same script CI asks (CI keeps
    # its own last-passing comparison for every push, docs-only ones included).
    changes:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        outputs:
            code: ${{ steps.diff.outputs.code }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Does this change anything besides docs?
              id: diff
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ github.event_name }}" = release ]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
                      # A manual run (S146's force): verify runs, and staging reaches its own checks.
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.event_name }}" = pull_request ]; then
                      scripts/ci-changes.sh pr "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
                  else
                      # Does this push itself (against its first parent, the previous stage head) change only docs?
                      # Then it deploys nothing, whatever earlier runs did (see above). A missing parent counts as code.
                      parent="$(git rev-parse -q --verify "${{ github.sha }}^" || true)"
                      own="$(GITHUB_OUTPUT= scripts/ci-changes.sh push "$parent" "${{ github.sha }}")"
                      if [ "$own" = "code=false" ]; then
                          echo "code=false" >> "$GITHUB_OUTPUT"
                      else
                          # The last commit on this branch whose push run of this workflow passed.
                          checked="$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=${{ github.ref_name }}&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)"
                          scripts/ci-changes.sh push "$checked" "${{ github.sha }}"
                      fi
                  fi

    # The same gate CI runs (pnpm verify), plus a dry run of every env's Worker bundle. On a pull request
    # it skips pnpm verify: ci.yml's verify job already runs that gate on the same pull request (with
    # Turborepo's cache) and its ci-passed is what the stage ruleset requires, so running it here too only
    # doubled every code pull request's wait (owner, 2026-11-21, asked whether Deploy's pull-request
    # verify should stop re-running the full pnpm verify: "Yes, drop the duplicate (Recommended)").
    # A push to stage and a release still run the full gate here before anything deploys.
    verify:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Verify
              if: github.event_name != 'pull_request'
              run: pnpm verify

            - name: Build the web app
              run: pnpm --filter @bt/web run build

            - name: Dry-run every env's Worker
              run: |
                  for env in preview staging production; do
                      pnpm --filter @bt/functions exec wrangler deploy --config ../wrangler.jsonc --env "$env" --dry-run --outdir "$RUNNER_TEMP/dry-run-$env"
                  done

    # One Worker per pull request that changes code (a docs-only one gets none), on the pull request's own
    # Neon branch and Hyperdrive config (issue #42). Pull requests from forks get no secrets, so they get
    # no preview. A run can wait in the pull request's concurrency group while it closes (or a close can
    # cancel it), so it asks GitHub whether the pull request is still open first and again just before
    # deploying, and if it has closed it tears the preview down instead and stops: a closed pull
    # request's preview is never recreated.
    # S146: before installing anything it fetches the record of this pull request's last successful
    # preview deploy (the `build-inputs-preview-<N>` artifact) and runs `pnpm build:inputs check` on it;
    # `unchanged` skips install, build, migrations and deploy, and the comment says the preview from the
    # recorded commit still serves this one. A record is stored only after the deploy step succeeds and
    # names the pull request's head commit (never GITHUB_SHA, GitHub's test merge), and preview-teardown
    # deletes it with the Worker. A reopened pull request always deploys: its Worker was deleted.
    preview:
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && needs.verify.result == 'success'
        needs: [verify]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Its own, so it keeps what its steps use: the comment (pull-requests: write), the release lookup
        # (issues: read, scripts/build-release.sh pr) and the last record (actions: read).
        permissions:
            actions: read
            contents: read
            issues: read
            pull-requests: write
        concurrency:
            group: deploy-preview-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
            BT_SESSION_KEY: ${{ secrets.BT_SESSION_KEY_STAGING }}
        steps:
            - uses: actions/checkout@v4

            - name: Is the pull request still open?
              id: open
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/preview-pr-open.sh ${{ github.event.pull_request.number }}

            # Its own pull request's milestone (#47), read live: it is assigned just after opening. Before the
            # input check, which compares it with the record's (it is built into the version line).
            - name: Which release is this build?
              if: steps.open.outputs.open == 'true'
              id: release
              # Explicit, so pipefail is on too (GitHub's default shell runs bash -e only).
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/build-release.sh pr ${{ github.event.pull_request.number }}

            # The newest unexpired record of this pull request's preview; only a deploy that succeeded stores one.
            - name: Fetch the record of this preview's last successful deploy (build:inputs)
              if: steps.open.outputs.open == 'true' && github.event.action != 'reopened'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  name="build-inputs-preview-${{ github.event.pull_request.number }}"
                  run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // ""')"
                  if [ -n "$run_id" ]; then
                      gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/last-deploy"
                  else
                      echo "no record of a deploy of this preview"
                  fi

            # Node 24 runs build-inputs.ts as it is (only node: imports), so the check needs no pnpm install.
            - uses: actions/setup-node@v4
              if: steps.open.outputs.open == 'true'
              with:
                  node-version-file: ".nvmrc"

            - name: Did the build's inputs change since this preview's last deploy? (pnpm build:inputs check)
              if: steps.open.outputs.open == 'true'
              id: inputs
              shell: bash
              env:
                  BT_RELEASE: ${{ steps.release.outputs.release }}
                  REOPENED: ${{ github.event.action == 'reopened' }}
              run: |
                  set -uo pipefail
                  record="$RUNNER_TEMP/last-deploy/build-inputs.json"
                  if [ "$REOPENED" = true ]; then
                      echo "reopened: its preview was deleted when it closed, so deploy"
                      build=true
                  elif out="$(node functions/src/deploy/build-inputs.ts check "$record")"; then
                      echo "$out: the preview's last deploy built from the same inputs"
                      build=false
                      echo "recorded=$(node functions/src/deploy/build-inputs.ts get "$record" commit)" >>"$GITHUB_OUTPUT"
                      echo "origin=$(node functions/src/deploy/build-inputs.ts get "$record" origin)" >>"$GITHUB_OUTPUT"
                  else
                      echo "$out"
                      build=true
                  fi
                  echo "build=$build" >>"$GITHUB_OUTPUT"

            # Also to tear down a pull request that closed (setup and install run for that too).
            - uses: pnpm/action-setup@v4
              if: steps.open.outputs.open == 'false' || steps.inputs.outputs.build == 'true'
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              if: steps.open.outputs.open == 'false' || steps.inputs.outputs.build == 'true'
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              if: steps.open.outputs.open == 'false' || steps.inputs.outputs.build == 'true'
              run: pnpm install --frozen-lockfile

            - name: It closed, so delete its preview (Worker, Hyperdrive config, Neon branch)
              if: steps.open.outputs.open == 'false'
              run: pnpm run deploy:teardown preview --pr ${{ github.event.pull_request.number }}

            # The head commit, not GITHUB_SHA (GitHub's test merge, which no one can look up).
            - name: Build the web app
              if: steps.open.outputs.open == 'true' && steps.inputs.outputs.build == 'true'
              env:
                  BT_RELEASE: ${{ steps.release.outputs.release }}
                  BT_COMMIT: ${{ github.event.pull_request.head.sha }}
              run: pnpm --filter @bt/web run build

            - name: Bootstrap (the pull request's own Neon branch from staging, its Hyperdrive config, Worker config and secrets)
              if: steps.open.outputs.open == 'true' && steps.inputs.outputs.build == 'true'
              id: bootstrap
              run: pnpm run deploy:bootstrap preview --pr ${{ github.event.pull_request.number }}

            - name: Migrate the preview's database
              if: steps.open.outputs.open == 'true' && steps.inputs.outputs.build == 'true'
              # Its database is reset from staging, which is ahead of a pull request built before stage gained a newer
              # migration (a re-run, or no push since), so newer migrations
              # pass with a warning; the pull request's own migration older than staging's newest still fails (#48).
              env:
                  BT_MIGRATIONS_MAY_BE_AHEAD: "1"
              run: pnpm db:migrate

            - name: Re-apply deletions
              if: steps.open.outputs.open == 'true' && steps.inputs.outputs.build == 'true'
              run: pnpm db:reapply-deletions

            # What this build read: Vite's module list (written by the build above), the Worker bundle's
            # esbuild metafile, the deploy scripts' graph and the named list, with the head commit and origin.
            - name: Record the build's inputs (pnpm build:inputs record)
              if: steps.open.outputs.open == 'true' && steps.inputs.outputs.build == 'true'
              env:
                  BT_RELEASE: ${{ steps.release.outputs.release }}
              run: |
                  pnpm --filter @bt/functions exec wrangler deploy --config ../wrangler.jsonc --env preview --dry-run --outdir "$RUNNER_TEMP/worker-dry-run" --metafile "$RUNNER_TEMP/worker-meta.json"
                  pnpm build:inputs record "$RUNNER_TEMP/build-inputs/build-inputs.json" --worker-meta "$RUNNER_TEMP/worker-meta.json" --commit "${{ github.event.pull_request.head.sha }}" --origin "${{ steps.bootstrap.outputs.origin }}"

            - name: Is the pull request still open, just before deploying?
              if: steps.open.outputs.open == 'true'
              id: still_open
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/preview-pr-open.sh ${{ github.event.pull_request.number }}

            - name: Deploy the preview Worker
              if: steps.still_open.outputs.open == 'true' && steps.inputs.outputs.build == 'true'
              run: pnpm --filter @bt/functions exec wrangler deploy --config "${{ steps.bootstrap.outputs.config }}" --env preview --secrets-file "${{ steps.bootstrap.outputs.secrets_file }}"

            # Only after the deploy step succeeded (a failed or cancelled deploy stores nothing).
            - name: Store the record of this deploy (build:inputs)
              if: steps.still_open.outputs.open == 'true' && steps.inputs.outputs.build == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: build-inputs-preview-${{ github.event.pull_request.number }}
                  path: ${{ runner.temp }}/build-inputs/build-inputs.json
                  if-no-files-found: error

            # A skipped run built nothing, so there is nothing of its own to tear down; preview-teardown deletes the rest.
            - name: It closed meanwhile, so delete its preview
              if: steps.still_open.outputs.open == 'false' && steps.inputs.outputs.build == 'true'
              run: pnpm run deploy:teardown preview --pr ${{ github.event.pull_request.number }}

            - name: Post the preview's address
              if: steps.still_open.outputs.open == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  BUILT: ${{ steps.inputs.outputs.build }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  RECORDED: ${{ steps.inputs.outputs.recorded }}
                  ORIGIN: ${{ steps.bootstrap.outputs.origin || steps.inputs.outputs.origin }}
              run: |
                  if [ "$BUILT" = true ]; then
                      body="Preview for $HEAD_SHA, on its own database (a copy of staging's), at $ORIGIN"
                  else
                      body="Preview for $HEAD_SHA: its build inputs are unchanged (pnpm build:inputs check), so the preview from $RECORDED still serves this one, at $ORIGIN"
                  fi
                  gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "$body"

    # A closed pull request's preview goes away: its Worker, its Hyperdrive config and its Neon branch
    # (issue #42), through `pnpm deploy:teardown`. Whatever is already gone is skipped; any other
    # failure fails the job, so nothing is left behind quietly. It shares the pull request's
    # concurrency group, so closing cancels a preview deploy still running; and if the pull request
    # was reopened while this waited, it deletes nothing (the reopen's preview run owns it).
    # S146: it deletes the pull request's build-inputs records first, since a record is only trusted
    # while its Worker exists; a failed deletion fails the job.
    preview-teardown:
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Reads the pull request's state (the workflow's write is for the preview's comment), and deletes
        # its build-inputs records (actions: write, S146).
        permissions:
            actions: write
            contents: read
            pull-requests: read
        concurrency:
            group: deploy-preview-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        steps:
            - uses: actions/checkout@v4

            - name: Was the pull request reopened meanwhile?
              id: open
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/preview-pr-open.sh ${{ github.event.pull_request.number }}

            - uses: pnpm/action-setup@v4
              if: steps.open.outputs.open == 'false'
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              if: steps.open.outputs.open == 'false'
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              if: steps.open.outputs.open == 'false'
              run: pnpm install --frozen-lockfile

            # Every build-inputs-preview-<N> artifact, so a later preview of this number never reads one as
            # `unchanged` for a Worker that no longer exists. set -e and pipefail: a failed call fails the job.
            - name: Delete the preview's build-inputs records (build:inputs)
              if: steps.open.outputs.open == 'false'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=build-inputs-preview-${{ github.event.pull_request.number }}&per_page=100" --paginate --jq '.artifacts[].id')"
                  for id in $ids; do
                      gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
                  done

            - name: Delete the preview (Worker, Hyperdrive config, Neon branch)
              if: steps.open.outputs.open == 'false'
              run: pnpm run deploy:teardown preview --pr ${{ github.event.pull_request.number }}

    # Every push to stage that changes code: stage.baseball.theater on the Neon staging branch (bt-staging),
    # unless its build inputs are unchanged since staging's last successful deploy (`pnpm build:inputs
    # check`, S146): then install, build, migrations and deploy are skipped. A manual run (workflow_dispatch
    # on stage with `force`) deploys whatever the record says.
    staging:
        # Only when something besides docs changed since the last passing run, and verify passed;
        # never after it failed or was cancelled. A docs-only push deploys nothing.
        if: >-
            ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/stage' &&
            needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && needs.verify.result == 'success' }}
        needs: [changes, verify]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Its own, so it keeps what its steps use: the release lookup (pull-requests, issues:
        # scripts/build-release.sh merged, #47) and the last record (actions: read, S146).
        permissions:
            actions: read
            contents: read
            issues: read
            pull-requests: read
        concurrency:
            group: deploy-staging
            cancel-in-progress: false
        environment:
            name: staging
            url: https://stage.baseball.theater
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
            BT_SESSION_KEY: ${{ secrets.BT_SESSION_KEY_STAGING }}
            BT_CF_PURGE_TOKEN: ${{ secrets.BT_CF_PURGE_TOKEN }}
            BT_CF_ZONE_ID: ${{ secrets.BT_CF_ZONE_ID }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # The deploy-staging group runs one deploy at a time but doesn't keep push order, and a
            # docs-only push no longer redeploys the head to heal an older run landing last. So each run
            # reads the commit staging serves (bt-commit.txt, written into the build below) and deploys
            # unless staging already serves this commit or one that contains it. Deciding from what is
            # served, not from what is on stage, means a newer run that fails or is cancelled never
            # strands an older commit that passed, unless the newer run already migrated the database:
            # then the older run's migrate step finds it ahead and fails (#48), so re-run the newest run.
            # - A 200 with a sha: compare. Read twice, a few seconds apart, so a deploy still spreading to
            #   the edge is seen; either read showing a commit containing this one skips.
            # - A 404, or a 200 without a sha (the SPA's index.html for a missing file): no marker yet
            #   (the first deploy, or a rollback to a build without it), so deploy.
            # - Anything else (no connection, a 5xx, a 408 or 429) after curl's retries: fail the step,
            #   so the run is re-run rather than deploying an older commit over a newer one blind.
            # A forced run (S146) redeploys the commit staging already serves, never one older than it.
            # The served sha is an output: the input check trusts only a record of that commit.
            - name: Does staging already serve this commit or a newer one?
              id: served
              env:
                  FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin stage
                  contains=false
                  served_sha=""
                  for attempt in 1 2; do
                      [ "$attempt" = 2 ] && sleep 10
                      status="$(curl -sS --retry 5 --max-time 10 -o "$RUNNER_TEMP/served" -w '%{http_code}' \
                          "https://stage.baseball.theater/bt-commit.txt?run=${{ github.run_id }}-$attempt")"
                      case "$status" in
                          200 | 404) ;;
                          *) echo "staging answered $status for bt-commit.txt; re-run this job" >&2; exit 1 ;;
                      esac
                      served="$(head -c 100 "$RUNNER_TEMP/served" | tr -d '[:space:]')"
                      if [ "$status" = 200 ] && [[ "$served" =~ ^[0-9a-f]{40}$ ]]; then
                          served_sha="$served"
                      fi
                      if [ "$status" = 200 ] && [[ "$served" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${served}^{commit}" 2>/dev/null &&
                          git merge-base --is-ancestor "${{ github.sha }}" "$served"; then
                          if [ "$FORCE" = true ] && [ "$served" = "${{ github.sha }}" ]; then
                              echo "forced: redeploy ${{ github.sha }}, which staging serves"
                          else
                              contains=true
                              echo "staging serves $served, which already contains ${{ github.sha }}"
                          fi
                      fi
                  done
                  echo "served=$served_sha" >>"$GITHUB_OUTPUT"
                  if [ "$contains" = true ]; then
                      echo "deploy=false" >>"$GITHUB_OUTPUT"
                  else
                      echo "deploy=true" >>"$GITHUB_OUTPUT"
                  fi

            # The milestone of the pull request this merge commit merged (#47). Before the input check,
            # which compares it with the record's (it is built into the version line).
            - name: Which release is this build?
              if: steps.served.outputs.deploy == 'true'
              id: release
              # Explicit, so pipefail is on too (GitHub's default shell runs bash -e only).
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/build-release.sh merged "${{ github.sha }}"

            # The newest unexpired record; only a deploy that succeeded stores one (the last step).
            - name: Fetch the record of staging's last successful deploy (build:inputs)
              if: steps.served.outputs.deploy == 'true'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=build-inputs-staging&per_page=100" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // ""')"
                  if [ -n "$run_id" ]; then
                      gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name build-inputs-staging --dir "$RUNNER_TEMP/last-deploy"
                  else
                      echo "no record of a staging deploy"
                  fi

            # Node 24 runs build-inputs.ts as it is (only node: imports), so the check needs no pnpm install.
            - uses: actions/setup-node@v4
              if: steps.served.outputs.deploy == 'true'
              with:
                  node-version-file: ".nvmrc"

            # Unchanged only when the record names the commit staging serves (after a `wrangler rollback`, or
            # an older run landing last, they differ and staging deploys), its BT_RELEASE is this build's,
            # and every file it lists has the same blob here. A forced run deploys whatever it says.
            - name: Did the build's inputs change since staging's last deploy? (pnpm build:inputs check)
              if: steps.served.outputs.deploy == 'true'
              id: inputs
              shell: bash
              env:
                  BT_RELEASE: ${{ steps.release.outputs.release }}
                  FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
                  SERVED: ${{ steps.served.outputs.served }}
              run: |
                  set -uo pipefail
                  record="$RUNNER_TEMP/last-deploy/build-inputs.json"
                  if [ "$FORCE" = true ]; then
                      echo "forced: deploy whatever the record says"
                      build=true
                  elif [ -z "$SERVED" ]; then
                      echo "staging serves no commit marker, so deploy"
                      build=true
                  elif out="$(node functions/src/deploy/build-inputs.ts check "$record" --served "$SERVED")"; then
                      echo "$out: staging's last deploy, of $SERVED, built from the same inputs"
                      build=false
                  else
                      echo "$out"
                      build=true
                  fi
                  echo "build=$build" >>"$GITHUB_OUTPUT"

            - uses: pnpm/action-setup@v4
              if: steps.inputs.outputs.build == 'true'
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              if: steps.inputs.outputs.build == 'true'
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              if: steps.inputs.outputs.build == 'true'
              run: pnpm install --frozen-lockfile

            # bt-commit.txt is how the next run learns what staging serves (see above).
            - name: Build the web app
              if: steps.inputs.outputs.build == 'true'
              env:
                  BT_RELEASE: ${{ steps.release.outputs.release }}
              run: |
                  pnpm --filter @bt/web run build
                  echo "${{ github.sha }}" >web/dist/bt-commit.txt

            - name: Bootstrap (schema-only staging branch, bt-staging, Worker config and secrets)
              if: steps.inputs.outputs.build == 'true'
              id: bootstrap
              run: pnpm run deploy:bootstrap staging

            - name: Migrate the staging database
              if: steps.inputs.outputs.build == 'true'
              run: pnpm db:migrate

            - name: Re-apply deletions
              if: steps.inputs.outputs.build == 'true'
              run: pnpm db:reapply-deletions

            # What this build read: Vite's module list (written by the build above), the Worker bundle's
            # esbuild metafile, the deploy scripts' graph and the named list, with this commit.
            - name: Record the build's inputs (pnpm build:inputs record)
              if: steps.inputs.outputs.build == 'true'
              env:
                  BT_RELEASE: ${{ steps.release.outputs.release }}
              run: |
                  pnpm --filter @bt/functions exec wrangler deploy --config ../wrangler.jsonc --env staging --dry-run --outdir "$RUNNER_TEMP/worker-dry-run" --metafile "$RUNNER_TEMP/worker-meta.json"
                  pnpm build:inputs record "$RUNNER_TEMP/build-inputs/build-inputs.json" --worker-meta "$RUNNER_TEMP/worker-meta.json" --commit "${{ github.sha }}" --origin https://stage.baseball.theater

            - name: Deploy staging
              if: steps.inputs.outputs.build == 'true'
              run: pnpm --filter @bt/functions exec wrangler deploy --config "${{ steps.bootstrap.outputs.config }}" --env staging --secrets-file "${{ steps.bootstrap.outputs.secrets_file }}"

            # Only after the deploy step succeeded (a failed or cancelled deploy stores nothing).
            - name: Store the record of this deploy (build:inputs)
              if: steps.inputs.outputs.build == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: build-inputs-staging
                  path: ${{ runner.temp }}/build-inputs/build-inputs.json
                  if-no-files-found: error

    # next.baseball.theater (until the owner's cutover, S119), when the owner publishes a GitHub Release,
    # once verify passes on its tag (S121). The release's tag is what deploys, never a branch head.
    # Rolling back is re-running the Deploy run of an earlier release that deployed before; only past
    # GitHub's 30-day re-run window, `wrangler rollback` to the previous deploy as a last resort (README).
    # A release published out of order fails before anything deploys (owner, 2026-11-13: "The only
    # way a rollback should happen is using a REAL rollback to a prior verison that had been
    # released. Otherwise, an unreleased release that is a lower version than the one that is live
    # should fail to deploy. If it still needs to be deployed, it'd need a new release."): see the
    # Release order step and scripts/release-order.sh.
    production:
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: [verify]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Its own, so a change to it keeps what the steps need: releases (contents) and past production
        # deployments (deployments) for the Release order step, and which pull request merged the
        # released commit (pull-requests, issues) for the release lookup (scripts/build-release.sh
        # merged, #47).
        permissions:
            contents: read
            deployments: read
            issues: read
            pull-requests: read
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        environment:
            name: production
            url: https://next.baseball.theater
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
            BT_SESSION_KEY: ${{ secrets.BT_SESSION_KEY_PRODUCTION }}
            BT_CF_PURGE_TOKEN: ${{ secrets.BT_CF_PURGE_TOKEN }}
            BT_CF_ZONE_ID: ${{ secrets.BT_CF_ZONE_ID }}
            LOGTO_S2S_APP_ID: ${{ secrets.LOGTO_S2S_APP_ID }}
            LOGTO_S2S_SECRET: ${{ secrets.LOGTO_S2S_SECRET }}
        steps:
            # Full history, so the Release order step can check main's ancestry.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 0

            # Before anything installs, builds or deploys: the release must be higher than every
            # other published release and contain main, unless this is a re-run of a release that
            # deployed before (a real rollback). The tag reaches the shell only through env.
            - name: Release order
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              # pipefail: a failed gh call fails the step instead of hiding behind awk or grep.
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin main
                  PUBLISHED_TAGS="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name')"
                  DEPLOYED_BEFORE=false
                  # A production deployment of this tag that succeeded before (gh's --jq takes no
                  # variables, so the tag is matched in awk, from env).
                  ids="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=100" --paginate --jq '.[] | "\(.id) \(.ref)"' |
                      awk -v tag="$TAG" '$2 == tag || $2 == "refs/tags/" tag { print $1 }')"
                  for id in $ids; do
                      # Captured first, so grep -q exiting early can't SIGPIPE gh under pipefail.
                      states="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --paginate --jq '.[].state')"
                      if grep -qx success <<<"$states"; then
                          DEPLOYED_BEFORE=true
                      fi
                  done
                  export PUBLISHED_TAGS DEPLOYED_BEFORE
                  bash scripts/release-order.sh

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # S131: from v4.0.0 on, a release deploys only with fan-facing notes the owner approved,
            # in the tagged commit's releases/<tag>.json; a pre-launch tag (below v4.0.0) carries none
            # and passes. Before anything is built, migrated or deployed. The tag comes in through env,
            # never pasted into the script.
            - name: Release notes approved
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: pnpm release:check "$TAG"

            # The tag's commit is the stage merge commit staging built, so the lookup, and the label,
            # match staging's (#47). The release procedure gives that pull request the release's
            # milestone; a mismatch is only warned about, since the build is still the tagged code.
            - name: Which release is this build?
              id: release
              # Explicit, so pipefail is on too (GitHub's default shell runs bash -e only).
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  out="$(scripts/build-release.sh merged "$(git rev-parse HEAD)")"
                  echo "$out"
                  release="${out#release=}"
                  if [ "$release" != "$TAG" ]; then
                      echo "::warning::the released commit's pull request is in milestone '$release', not $TAG"
                  fi

            # bt-commit.txt names the commit production serves, as on staging (#47).
            - name: Build the web app
              env:
                  BT_RELEASE: ${{ steps.release.outputs.release }}
              run: |
                  pnpm --filter @bt/web run build
                  git rev-parse HEAD >web/dist/bt-commit.txt

            - name: Bootstrap (production branch, bt-production, Worker config and secrets)
              id: bootstrap
              run: pnpm run deploy:bootstrap production

            - name: Migrate the production database
              # A database ahead of the code (newer migrations only) passes with a warning here alone: re-running
              # an older release's Deploy run is the rollback, and production never gets a preview's migrations (#48).
              env:
                  BT_MIGRATIONS_MAY_BE_AHEAD: "1"
              run: pnpm db:migrate

            - name: Re-apply deletions
              run: pnpm db:reapply-deletions

            # The job's last step: its `production` environment deployment succeeds exactly when the
            # Worker went live, which the Release order step reads to allow a rollback re-run. Logto's
            # registration runs in production-logto, after this job.
            - name: Deploy production
              run: pnpm --filter @bt/functions exec wrangler deploy --config "${{ steps.bootstrap.outputs.config }}" --env production --secrets-file "${{ steps.bootstrap.outputs.secrets_file }}"

    # main mirrors production (S121; owner, 2026-11-07: "2. Mirror"): once the release is live, move
    # main to the released commit, as a fast-forward only. A plain `git push` already refuses a
    # non-fast-forward; the ancestry check first makes that a clear error instead of a git message.
    # It never forces, so a rollback to an older release fails here on purpose and leaves main at
    # the newer release. The push goes over SSH with a write deploy key (`MAIN_MIRROR_KEY`, a
    # `production` environment secret), because a personal-account repo's rulesets can't list GitHub
    # Actions as a bypass actor but can list deploy keys (owner, 2026-11-07: "Yes, deploy keys is
    # there"); the `main` ruleset lists Deploy keys in its bypass list (README). Unlike the workflow
    # token, a deploy-key push does start workflows: CI runs on main once more, and this workflow
    # doesn't run on a push to main, so nothing redeploys.
    mirror-main:
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: [production]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # For MAIN_MIRROR_KEY, which only the production environment holds.
        environment: production
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 0
                  ssh-key: ${{ secrets.MAIN_MIRROR_KEY }}

            - name: Fast-forward main to the released commit
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  released=$(git rev-parse "HEAD^{commit}")
                  git fetch --no-tags origin main
                  current=$(git rev-parse origin/main)
                  if [ "$current" = "$released" ]; then
                      echo "main is already at $TAG ($released)"
                      exit 0
                  fi
                  if ! git merge-base --is-ancestor "$current" "$released"; then
                      echo "::error::main ($current) is not an ancestor of $TAG ($released), so it cannot fast-forward. Production runs $TAG; main stays where it is. A rollback to an older release does this on purpose; otherwise main was changed by hand."
                      exit 1
                  fi
                  git push origin "$released:refs/heads/main"
                  echo "main fast-forwarded from $current to $TAG ($released)"

    # After the Worker is live, so a Logto hiccup never holds a release back; it fails this job
    # visibly instead. Idempotent: an unchanged origin changes nothing in Logto. Its own job (Claude's
    # review of PR #51), so a Logto failure doesn't mark the production job's environment deployment
    # failed: the Release order step reads that status to tell a release that went live (a rollback
    # may re-run it) from one that never did. This job's own `production` deployment may fail; the
    # Release order step needs only one successful deployment of the tag.
    production-logto:
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: [production]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # For LOGTO_S2S_APP_ID and LOGTO_S2S_SECRET, held for production only.
        environment: production
        permissions:
            contents: read
        env:
            LOGTO_S2S_APP_ID: ${{ secrets.LOGTO_S2S_APP_ID }}
            LOGTO_S2S_SECRET: ${{ secrets.LOGTO_S2S_SECRET }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Register production's Logto sign-in and sign-out addresses
              run: pnpm run deploy:logto production
