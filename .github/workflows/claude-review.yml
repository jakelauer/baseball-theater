name: Claude review

# Claude's pull request review (owner, 2026-11-11: "Yes, let's replace the entire copilot review system
# with the claude one"). It replaces GitHub Copilot's review and works the same way: it runs when a pull
# request opens and again on each push, reads the diff against docs/v3/LOOP.md §7's review-class checklist,
# and posts each real finding as an inline comment the coordinator must fix or answer and resolve before
# the pull request merges (CLAUDE.md → "Claude's review is handled before a pull request merges"; the
# `stage` ruleset's "Require conversation resolution before merging" backs it up). Its summary review,
# posted with commit_id = the reviewed head sha, is how the coordinator knows the review of the newest
# commits has posted (a pull_request_target run's check is attached to the base branch's commit, not the
# head's, so the check can't say it). So the `report` job sets a `claude-review/posted` commit status
# on the head sha the run reviewed: success once its review is posted, failure if none was or if a
# finding went in the review's body. The `stage` ruleset requires `claude-review/posted` (source: GitHub
# Actions), so GitHub itself refuses to merge a pull request whose newest commit has no posted review,
# and auto-merge can go on when its base is `stage` (owner, 2026-11-21, asked whether this would be
# "just a Claude rule" or "prevention on GitHub itself": "I want you to just do it right now"). The
# context must never match a job's name: a pull_request_target run's check runs sit on the base
# branch's tip, which for a stacked pull request is the head of the pull request below it, so a check
# run named like the context would satisfy or block that one (and a failed `claude-review` or
# `report` check on a lower pull request's head belongs to the one stacked on it). A new push is a new head with no status,
# so it blocks again until that push is reviewed; a run that is cancelled (a newer push supersedes it),
# times out, or fails before it learns the head sha may leave no status either, which blocks until a
# re-run. Like the review's record, the status trusts the repository's writers: a same-repository
# workflow with `statuses: write` could set it. The findings themselves block through "Require
# conversation resolution": post-review.py makes each one a thread, inline or, when GitHub refuses the
# review's line comments, file-level (every in-diff finding then, not only the one that failed to
# anchor); only a finding on a file outside the diff, or one refused on its file too, goes in the body.
# The status's failure for a body finding holds only until the next review of any kind: a merge from
# `stage` or a re-run (each usually an `unchanged` review, with no model call) sets success, so the
# coordinator answers a body finding before either. A fork's pull request gets no review and so no
# status: it can't merge without the owner's bypass or a dispatched review (below).
#
# The summary is a pull request review (event COMMENT), not an issue comment: deploy.yml's preview step
# edits the bot's last issue comment (`gh pr comment --edit-last`), and both workflows post as
# github-actions[bot], so a summary posted as a comment would be overwritten.
#
# Trust (owner, 2026-11-11: "switch" to pull_request_target). The run uses the base branch's copy of this
# workflow and its scripts, so a pull request can't rewrite its own reviewer; a change to this file is
# never reviewed by its own new version, so the owner reviews it. The run holds this repository's secrets,
# so nothing from the pull request runs or is loaded as config:
# - The working tree is the base branch (dispatched: the branch the workflow runs from, `stage`). The
#   project's Claude Code hooks and the scripts they call are the base branch's.
# - The pull request's files, diff and existing review comments are extracted by a trusted step into
#   ~/pr-review, outside the working tree, as inert text (scripts/claude-review/extract-pr.py: raw
#   blobs, no .gitattributes, symlinks written out as text, configuration names renamed).
# - No credential is on disk or in the reviewer's environment beyond the Anthropic one the action needs:
#   checkout keeps no git credentials, GH_TOKEN is set only on the extract, plan and post steps, the
#   review job's token can't set commit statuses (only the `report` job's can), and reads of /proc,
#   /sys, /etc, /dev, /tmp, the runner's _temp and _actions folders, dot-folders in the home folder and
#   .git are denied (Read rules cover Grep and Glob too). The post blanks out any secret a review
#   quotes, plain or as the base64 git header.
# - The reviewer has only Read, Grep and Glob: no shell (some git flags write files or run commands) and
#   no GitHub API (which could approve or resolve threads). It returns its findings as JSON, and a trusted
#   step (scripts/claude-review/post-review.py) posts them as one COMMENT review (plus, when GitHub
#   refuses its line comments, a file-level review comment for each in-diff finding), never anything
#   else.
# - A fork's pull request is skipped (so it gets no `claude-review/posted` status; see above).
#
# workflow_dispatch reviews one pull request by number, merged or not: it is how a pull request
# labelled `copilot-review-owed` (merged while Copilot had no quota) gets its review after the fact
# (`gh workflow run claude-review.yml --ref stage -f pr=<n>`).
#
# Auth: the ANTHROPIC_API_KEY repository secret, or CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) to
# bill a Claude subscription instead; set one of them. The review posts as github-actions[bot] through
# this run's own token, so no GitHub App is needed.
on:
    pull_request_target:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:
        inputs:
            pr:
                description: "Pull request number to review (merged or open)"
                required: true
                type: number

concurrency:
    group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
    cancel-in-progress: true

jobs:
    claude-review:
        # A draft isn't reviewed until it's marked ready (ready_for_review then triggers it), and a fork's
        # pull request never is (see Trust above).
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            pull-requests: write
        # For the `report` job's status. Job outputs are read when the job ends, failed or not, so a run
        # that posted nothing still reports its head (and `posted` false).
        outputs:
            head: ${{ steps.pr.outputs.head }}
            posted: ${{ steps.post.outcome == 'success' }}
            in_body: ${{ steps.post.outputs.in_body || '0' }}
        env:
            PR: ${{ github.event.pull_request.number || inputs.pr }}
        steps:
            # No credentials saved in git's config (the reviewer must find no token on disk); the
            # repository is public, so fetching needs none.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Everything the reviewer reads about the pull request, in ~/pr-review, outside both the working
            # tree and the runner's _temp folder (whose step scripts and command files the reviewer is denied):
            # head/ (its files at the head sha), diff.patch, changed.txt, pr.json, review-comments.json.
            # changed.txt keeps non-ASCII paths as they are (core.quotePath=false), so post-review.py can
            # match a finding's path against it.
            # GH_TOKEN is set only on this step, the plan and the post, never in the reviewer's environment.
            - name: Extract the pull request for reading (nothing from it runs)
              id: pr
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin "refs/pull/${PR}/head:refs/remotes/pr/${PR}"
                  head="$(git rev-parse "refs/remotes/pr/${PR}")"
                  base="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .base.sha)"
                  git cat-file -e "${base}^{commit}" 2>/dev/null || git fetch --no-tags origin "$base"
                  dir="$HOME/pr-review"
                  mkdir -p "$dir/head"
                  python3 scripts/claude-review/extract-pr.py "$head" "$dir/head"
                  git diff "${base}...${head}" >"$dir/diff.patch"
                  git -c core.quotePath=false diff --name-status "${base}...${head}" >"$dir/changed.txt"
                  gh pr view "$PR" --json number,title,body,author,baseRefName,headRefName,state >"$dir/pr.json"
                  gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" --paginate >"$dir/review-comments.json"
                  echo "head=$head" >>"$GITHUB_OUTPUT"
                  echo "base=$base" >>"$GITHUB_OUTPUT"
                  echo "dir=$dir" >>"$GITHUB_OUTPUT"

            # What to review and how hard (scripts/claude-review/plan-review.py): full, incremental (only
            # what changed since the last recorded review) or unchanged (no model call); and the model and
            # turn cap from the diff being reviewed (owner, 2026-11-11).
            - name: Plan the review (mode, model, turns)
              id: plan
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ steps.pr.outputs.head }}
                  BASE_SHA: ${{ steps.pr.outputs.base }}
                  REVIEW_DIR: ${{ steps.pr.outputs.dir }}
              run: python3 scripts/claude-review/plan-review.py

            # The owner's Claude plan first, the API key only if that can't start (owner, 2026-11-11,
            # asked whether it can accept both and use one then the other, plan first: "yes"). Each
            # attempt gets one credential, so which one paid is never in doubt.
            - uses: anthropics/claude-code-action@v1
              id: claude_plan
              if: steps.plan.outputs.mode != 'unchanged'
              continue-on-error: true
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  github_token: ${{ github.token }}
                  claude_args: >-
                      --model ${{ steps.plan.outputs.model }}
                      --max-turns ${{ steps.plan.outputs.turns }}
                      --add-dir ${{ steps.pr.outputs.dir }}
                      --allowedTools "Read,Grep,Glob"
                      --disallowedTools "Bash,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(//dev/**),Read(//home/runner/work/_temp/**),Read(//home/runner/work/_actions/**),Read(//home/runner/.*/**),Read(//home/runner/.*),Read(//tmp/**),Read(./.git/**)"
                  prompt: ${{ steps.plan.outputs.prompt }}

            # Fall back only when the plan attempt failed before reviewing anything (an error result after
            # at most one turn, with nothing spent: a usage limit, a missing or expired token). A review
            # that failed partway isn't repeated at the API key's cost.
            - name: Did the plan attempt fail before it started?
              id: fallback
              if: steps.claude_plan.outcome == 'failure'
              env:
                  EXECUTION_FILE: ${{ steps.claude_plan.outputs.execution_file }}
              run: |
                  python3 - <<'PY' >>"$GITHUB_OUTPUT"
                  import json, os
                  try:
                      result = [m for m in json.load(open(os.environ["EXECUTION_FILE"])) if m.get("type") == "result"][-1]
                      early = result.get("num_turns", 0) <= 1 and not result.get("total_cost_usd")
                  except Exception:
                      early = True
                  print(f"use_api_key={'true' if early else 'false'}")
                  PY

            - uses: anthropics/claude-code-action@v1
              id: claude_api
              if: steps.fallback.outputs.use_api_key == 'true'
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ github.token }}
                  claude_args: >-
                      --model ${{ steps.plan.outputs.model }}
                      --max-turns ${{ steps.plan.outputs.turns }}
                      --add-dir ${{ steps.pr.outputs.dir }}
                      --allowedTools "Read,Grep,Glob"
                      --disallowedTools "Bash,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(//dev/**),Read(//home/runner/work/_temp/**),Read(//home/runner/work/_actions/**),Read(//home/runner/.*/**),Read(//home/runner/.*),Read(//tmp/**),Read(./.git/**)"
                  prompt: ${{ steps.plan.outputs.prompt }}

            - name: Post the review
              id: post
              if: steps.plan.outputs.mode == 'unchanged' || steps.claude_plan.outcome == 'success' || steps.claude_api.outcome == 'success'
              env:
                  EXECUTION_FILE: ${{ steps.claude_api.outputs.execution_file || steps.claude_plan.outputs.execution_file }}
                  PAID_BY: ${{ steps.claude_api.outcome == 'success' && 'the API key' || (steps.claude_plan.outcome == 'success' && 'the Claude plan' || 'nothing (no model call)') }}
                  MODE: ${{ steps.plan.outputs.mode }}
                  WHY: ${{ steps.plan.outputs.why }}
                  RECORD_FILE: ${{ steps.pr.outputs.dir }}/../record.json
                  PREVIOUS_FILE: ${{ steps.pr.outputs.dir }}/previous-review.json
                  HEAD_SHA: ${{ steps.pr.outputs.head }}
                  # changed.txt: which findings GitHub refuses inline can still be file-level threads.
                  REVIEW_DIR: ${{ steps.pr.outputs.dir }}
                  GH_TOKEN: ${{ github.token }}
                  # Only so the post can blank them out if a review ever quotes one.
                  REDACT_1: ${{ secrets.ANTHROPIC_API_KEY }}
                  REDACT_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
              run: python3 scripts/claude-review/post-review.py

            # The plan attempt may fail without failing the job (continue-on-error), so the job fails here
            # whenever no review was posted: the coordinator re-runs it, and nothing merges unreviewed.
            - name: A review was posted
              if: steps.post.outcome != 'success'
              run: |
                  echo "No review was posted for this commit; re-run this job (CLAUDE.md: a pull request never merges without one)." >&2
                  exit 1

    # The required `claude-review/posted` status (see the header), on the exact sha the review job
    # reviewed. A job of its own, so the token handed to claude-code-action above can't set its own
    # gate. It runs whether the review job passed or failed, but not when the run was cancelled, the
    # review job was skipped (a draft, a fork) or its extract step failed before it learned the head
    # sha; each leaves no status, which blocks until a re-run.
    report:
        needs: claude-review
        if: ${{ !cancelled() && needs.claude-review.outputs.head != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            statuses: write
        steps:
            - name: Set the claude-review/posted status
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ needs.claude-review.outputs.head }}
                  POSTED: ${{ needs.claude-review.outputs.posted }}
                  IN_BODY: ${{ needs.claude-review.outputs.in_body }}
              run: |
                  if [ "$POSTED" = true ] && [ "${IN_BODY:-0}" != 0 ]; then
                      # No thread holds these (post-review.py): answer them before a merge from stage or a re-run.
                      state=failure; description="${IN_BODY} finding(s) in the review body, not as threads; fix and push"
                  elif [ "$POSTED" = true ]; then
                      state=success; description="Review posted; open threads still block the merge"
                  else
                      state=failure; description="No review was posted; re-run this workflow"
                  fi
                  gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="$state" -f context=claude-review/posted \
                      -f description="$description" \
                      -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
